services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: connectively
      POSTGRES_PASSWORD: connectively
      POSTGRES_DB: connectively
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
